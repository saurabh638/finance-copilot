[project]
name = "finance-copilot-backend"
version = "0.1.0"
description = "Finance Co-pilot backend (FastAPI)."
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ANN", "S", "C4", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Tests assert on behaviour, so S101 (use of assert) is expected there, and
# S105/S106 flag the dummy credentials used as fixtures, which are not secrets.
"tests/**" = ["S101", "S105", "S106"]
# Generated migrations hold long DDL string literals that cannot be wrapped.
"alembic/versions/*.py" = ["E501"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's Depends and Query are designed to be called in an argument default.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]

[tool.ruff.lint.isort]
# `app` is the only first-party package. Without this, the local `alembic/`
# directory makes ruff treat the alembic library as first-party too.
known-first-party = ["app"]

[tool.mypy]
python_version = "3.12"
files = ["app"]
plugins = ["pydantic.mypy"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unreachable = true

[[tool.mypy.overrides]]
# core/ is pure money and date logic, so it holds to the strictest bar.
module = "app.core.*"
strict = true

[[tool.mypy.overrides]]
# APScheduler ships no type information, and the one job it runs is our own code.
module = ["apscheduler.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=app --cov-report=term-missing --cov-fail-under=80"
